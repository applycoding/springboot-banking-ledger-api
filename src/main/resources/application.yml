spring:
  application:
    name: banking-ledger
  datasource:
    url: jdbc:postgresql://localhost:54329/ledger
    username: ledger
    password: ledger
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: 8094
  error:
    include-message: never
    include-stacktrace: never

ledger:
  jwt:
    # Dev-only HMAC secret. Override with LEDGER_JWT_SECRET (base64, at least 32 bytes).
    secret: ${LEDGER_JWT_SECRET:AauGoKTfFAhSEkm1wTWOh2QoSNbe83IS0XmbUeAUvcA=}
    expiration: 1h

springdoc:
  swagger-ui:
    path: /swagger-ui.html
